---
# sambas_ad_dc role - tasks/main.yml
#
# Lab-safe Samba AD DC provisioning using FUNCTIONAL validation:
# - sam.ldb exists
# - samba-ad-dc is running
# - samba-tool dns query works (DNS RPC)
#
# This avoids false failures when /var/lib/samba/private/dns is not present on your Samba build.

# ----------------------------
# Base package/service prep
# ----------------------------
- name: Install required packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

# Deterministic DC1/DC2 selection (lab)
- name: Determine DC1/DC2 from samba_dc inventory order (lab deterministic)
  ansible.builtin.set_fact:
    dc1_effective: "{{ (groups['samba_dc'] | sort)[0] }}"
    dc2_effective: "{{ (groups['samba_dc'] | sort)[1] }}"

# Ensure local name resolution is consistent for provisioning/join
- name: Ensure /etc/hosts contains FQDN and shortname mapping
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE SAMBA AD DC HOSTS"
    block: |
      {% for h in groups['samba_dc'] | sort %}
      {{ dc_ips[h] }} {{ h }}.{{ ad_domain }} {{ h }}
      {% endfor %}

# ----------------------------------------------------------
# smb.conf handling FIRST (prevents config poisoning)
# ----------------------------------------------------------
- name: Check if smb.conf exists (pre-AD)
  ansible.builtin.stat:
    path: /etc/samba/smb.conf
  register: smbconf_stat

- name: Read smb.conf for role detection
  ansible.builtin.slurp:
    path: /etc/samba/smb.conf
  register: smbconf_slurp
  when: smbconf_stat.stat.exists

- name: Move existing smb.conf aside if not AD DC mode (prevents config poisoning)
  ansible.builtin.command: >
    mv /etc/samba/smb.conf /etc/samba/smb.conf.pre_ad
  args:
    creates: /etc/samba/smb.conf.pre_ad
  failed_when: false
  when:
    - smbconf_stat.stat.exists
    - (smbconf_slurp.content | b64decode | lower) is not search("server role\\s*=\\s*active directory domain controller")

# ----------------------------------------------------------
# Pre-flight: stop conflicting services BEFORE AD operations
# ----------------------------------------------------------
- name: Disable conflicting Samba services (smbd/nmbd/winbind) before AD DC operations
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - smbd
    - nmbd
    - winbind
  ignore_errors: true

# ----------------------------------------------------------
# Detect minimal state (sam.ldb)
# ----------------------------------------------------------
- name: Check if Samba AD database exists (sam.ldb)
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb

- name: Set initial provisioned fact (sam.ldb exists)
  ansible.builtin.set_fact:
    samba_has_ad_db: "{{ samba_sam_ldb.stat.exists }}"

# ----------------------------------------------------------
# Resolver bootstrap during provision/join (Technitium first)
# ----------------------------------------------------------
- name: Disable systemd-resolved (recommended for Samba AD DC)
  ansible.builtin.service:
    name: systemd-resolved
    enabled: false
    state: stopped
  when:
    - samba_manage_resolver | bool
    - not samba_has_ad_db | bool

- name: Remove symlinked /etc/resolv.conf (if present)
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - samba_manage_resolver | bool
    - not samba_has_ad_db | bool

- name: Install bootstrap /etc/resolv.conf pointing to Technitium during provision/join
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (bootstrap resolver for Samba AD DC provision/join)
      {% for ip in dns_forwarders %}
      nameserver {{ ip }}
      {% endfor %}
      options timeout:2 attempts:2
  when:
    - samba_manage_resolver | bool
    - not samba_has_ad_db | bool

# ----------------------------------------------------------
# LAB WIPE RULE (functional):
# If sam.ldb exists but DNS RPC is broken, wipe/rebuild.
# We can only test DNS RPC if samba-ad-dc is running, so:
# - If sam.ldb exists: try starting samba-ad-dc and test DNS RPC.
# - If DNS RPC fails: wipe.
# ----------------------------------------------------------
- name: Unmask samba-ad-dc (safe no-op)
  ansible.builtin.command: systemctl unmask samba-ad-dc
  changed_when: false
  failed_when: false

- name: Start samba-ad-dc (to enable DNS RPC test if sam.ldb exists)
  ansible.builtin.service:
    name: samba-ad-dc
    enabled: true
    state: started
  when: samba_has_ad_db | bool

- name: Wait for LDAP locally (389) if sam.ldb exists
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 389
    timeout: 180
  when: samba_has_ad_db | bool

- name: Test Samba DNS RPC (pre-flight)
  ansible.builtin.command: samba-tool dns query localhost "{{ ad_domain }}" @ ALL -U "Administrator%{{ ad_admin_password }}"
  register: dnsrpc_precheck
  changed_when: false
  failed_when: false
  when: samba_has_ad_db | bool

- name: Set lab wipe flag (wipe if sam.ldb exists but DNS RPC fails)
  ansible.builtin.set_fact:
    samba_lab_wipe: "{{ samba_has_ad_db and (dnsrpc_precheck.rc is defined) and (dnsrpc_precheck.rc != 0) }}"

- name: Wipe Samba state if DNS RPC is broken (lab rebuild)
  when: samba_lab_wipe | bool
  block:
    - name: Stop samba-ad-dc prior to wipe
      ansible.builtin.service:
        name: samba-ad-dc
        state: stopped
      failed_when: false

    - name: Stop conflicting Samba services prior to wipe
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - smbd
        - nmbd
        - winbind
      ignore_errors: true

    - name: Remove Samba state and config (lab)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/samba
        - /var/cache/samba
        - /etc/samba/smb.conf
        - /etc/samba/smb.conf.pre_ad
        - /etc/krb5.conf

    - name: Recreate Samba state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/samba
        - /var/lib/samba/private
        - /var/cache/samba

# Re-detect sam.ldb after possible wipe
- name: Re-check if Samba AD database exists (post wipe)
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb

- name: Update has_ad_db fact (post wipe)
  ansible.builtin.set_fact:
    samba_has_ad_db: "{{ samba_sam_ldb.stat.exists }}"

# ----------------------------------------------------------
# DC1: Provision (only if sam.ldb missing)
# ----------------------------------------------------------
- name: Provision the AD domain on DC1 (first domain controller)
  ansible.builtin.command: >
    samba-tool domain provision
    --realm={{ ad_realm }}
    --domain={{ ad_netbios }}
    --server-role=dc
    --dns-backend=SAMBA_INTERNAL
    --use-rfc2307
    --adminpass={{ ad_admin_password }}
    --option="dns forwarder = {{ dns_forwarders | join(' ') }}"
  args:
    creates: /var/lib/samba/private/sam.ldb
  when:
    - inventory_hostname == dc1_effective
    - not samba_has_ad_db | bool

# Start DC1 immediately after provision so DC2 can join
- name: Enable and start samba-ad-dc on DC1 (post-provision)
  ansible.builtin.service:
    name: samba-ad-dc
    enabled: true
    state: started
  when: inventory_hostname == dc1_effective

- name: Wait for LDAP on DC1 locally (389) after start
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 389
    timeout: 240
  when: inventory_hostname == dc1_effective

- name: Wait for DNS on DC1 locally (53) after start
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 53
    timeout: 240
  when: inventory_hostname == dc1_effective

# ----------------------------------------------------------
# DC2: Join (gated on DC1 readiness)
# ----------------------------------------------------------
- name: Wait for DC1 LDAP to be reachable from DC2 (before join)
  ansible.builtin.wait_for:
    host: "{{ dc_ips[dc1_effective] }}"
    port: 389
    timeout: 300
  when:
    - inventory_hostname == dc2_effective
    - not samba_has_ad_db | bool

- name: Join DC2 to the domain as an additional DC (target DC1 explicitly)
  ansible.builtin.command: >
    samba-tool domain join {{ ad_realm }} DC
    --dns-backend=SAMBA_INTERNAL
    --server={{ dc1_effective }}.{{ ad_domain }}
    -U "Administrator%{{ ad_admin_password }}"
    --option="dns forwarder = {{ dns_forwarders | join(' ') }}"
  args:
    creates: /var/lib/samba/private/sam.ldb
  when:
    - inventory_hostname == dc2_effective
    - not samba_has_ad_db | bool

# ----------------------------------------------------------
# Kerberos config (only when sam.ldb exists)
# ----------------------------------------------------------
- name: Re-check if Samba AD database exists (post provision/join)
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb

- name: Fail if sam.ldb is missing after provision/join
  ansible.builtin.fail:
    msg: "Samba AD database sam.ldb is missing after provision/join."
  when: not samba_sam_ldb.stat.exists

- name: Copy Samba-generated krb5.conf into /etc/krb5.conf
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: samba_sam_ldb.stat.exists

# ----------------------------------------------------------
# Start AD DC service (both DCs) and validate functionally
# ----------------------------------------------------------
- name: Enable and start samba-ad-dc
  ansible.builtin.service:
    name: samba-ad-dc
    enabled: true
    state: started

- name: Wait for LDAP to be reachable locally (389)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 389
    timeout: 240

- name: Wait for DNS to be reachable locally (53)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 53
    timeout: 240

# THIS is now the definitive "provisioned" test (not a filesystem path)
- name: Validate Samba DNS RPC works (local)
  ansible.builtin.command: samba-tool dns query localhost "{{ ad_domain }}" @ ALL -U "Administrator%{{ ad_admin_password }}"
  register: dnsrpc_check
  changed_when: false
  failed_when: dnsrpc_check.rc != 0

# ----------------------------------------------------------
# Resolver finalization
# ----------------------------------------------------------
- name: Install final /etc/resolv.conf pointing to local DNS then Technitium
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  when: samba_manage_resolver | bool

# ----------------------------------------------------------
# UPN suffix configuration (DC1 only)
# ----------------------------------------------------------
- name: Build base DN from ad_domain
  ansible.builtin.set_fact:
    ad_base_dn: "{{ 'DC=' + (ad_domain.split('.') | join(',DC=')) }}"
  when: inventory_hostname == dc1_effective

- name: Set partitions DN for UPN suffix storage
  ansible.builtin.set_fact:
    partitions_dn: "CN=Partitions,CN=Configuration,{{ ad_base_dn }}"
  when: inventory_hostname == dc1_effective

- name: Read existing UPN suffixes from sam.ldb
  ansible.builtin.command: >
    ldbsearch -H /var/lib/samba/private/sam.ldb -b "{{ partitions_dn }}" uPNSuffixes
  register: upn_suffixes_current
  changed_when: false
  when: inventory_hostname == dc1_effective

- name: Add UPN suffixes if missing
  ansible.builtin.command: ldbmodify -H /var/lib/samba/private/sam.ldb
  args:
    stdin: |
      dn: {{ partitions_dn }}
      changetype: modify
      add: uPNSuffixes
      uPNSuffixes: {{ item }}
      -
  loop: "{{ upn_suffixes | default([]) }}"
  when:
    - inventory_hostname == dc1_effective
    - upn_suffixes_current.stdout is not search('(?im)^uPNSuffixes:\\s*' ~ (item | regex_escape) ~ '\\s*$')

# ----------------------------------------------------------
# Validation
# ----------------------------------------------------------
- name: Validate replication
  ansible.builtin.command: samba-tool drs showrepl
  register: repl_out
  changed_when: false
  failed_when: repl_out.rc != 0

- name: Validate SRV records on the local DC DNS
  ansible.builtin.command: "host -t SRV _ldap._tcp.{{ ad_domain }} 127.0.0.1"
  register: srv_out
  changed_when: false
  failed_when: srv_out.rc != 0

